# The Maze Runner — the first real book this engine is meant to run against.
#
# The lesson structure below is the one 4Steps has already taught from, so the
# generated vocabulary lines up with workbooks that exist. Everything else is
# the engine's default.
#
# Before this will run you need two things this file cannot supply:
#
#   1. The PDF, at ../sources/the-maze-runner.pdf. `sources/` is gitignored and
#      a book is never committed. Use a copy 4Steps already owns.
#
#   2. The real chapter count, read off the book's own contents page. The value
#      below is what the lesson plan implies, not something anybody has checked
#      against this edition. See the note on expected_chapters.
#
# Then, in order:
#
#   bookengine ingest --book sources/the-maze-runner.pdf --expected-chapters <N>
#   bookengine smoke  --config configs/the-maze-runner.yaml
#   bookengine vocab  --config configs/the-maze-runner.yaml
#
# The ingest step first, on its own, and read what it prints. See
# FIRST-REAL-BOOK.md for what to check in it and why.

book:
  path: ../sources/the-maze-runner.pdf
  title: The Maze Runner

  # 62 is what the lesson plan below adds up to, and it is a claim about this
  # edition that nobody has verified. The PDF is the source of truth: run
  # `ingest` first and use the count it reports, once you have checked that
  # count against the contents page.
  #
  # A mismatch here is a refusal, not a warning, and that is the point — an
  # edition with an epilogue detected as chapter 63, or a prologue detected as
  # chapter 1, would shift every chapter reference in the workbook by one and
  # nothing downstream would notice.
  expected_chapters: 62

audience:
  grade_min: 7
  grade_max: 8
  description: >-
    Korean middle-school students reading a full English novel. They can follow
    the story; the vocabulary is the part that stops them.

vocabulary_per_lesson: 20

# Three times the final count. The audit rejects entries, and a lesson with no
# room to replace one fails instead.
candidates_per_lesson: 60

# The chapter ranges 4Steps has taught from. Five lessons, one hundred words.
lessons:
  - lesson: 1
    start_chapter: 1
    end_chapter: 12
  - lesson: 2
    start_chapter: 13
    end_chapter: 24
  - lesson: 3
    start_chapter: 25
    end_chapter: 36
  - lesson: 4
    start_chapter: 37
    end_chapter: 48
  - lesson: 5
    start_chapter: 49
    end_chapter: 62

exclusions:
  # This book invents its own slang, and a student learning `shuck` learns
  # nothing they can use. The audit would catch most of these on
  # `generality`; naming them costs nothing and saves the candidates.
  terms:
    - shuck
    - shuck-face
    - klunk
    - greenie
    - griever
    - shank
    - slinthead
    - glade
    - glader
    - wicked
  allow_invented_terms: false

llm:
  # Every model id below answered a live structured request through this
  # engine's own adapters on 2026-08-22. They will go stale; `bookengine smoke
  # --config <this file>` is how you find out. PROVIDERS.md records what was
  # measured and why the route is shaped this way.

  # Groq generates. One entry draft measured 1,181 in / 477 out, which sits
  # comfortably inside its 8,000-tokens-per-minute free allowance — and Groq
  # charges that allowance for `max_tokens` requested rather than used, so
  # keeping the ceiling tight here is what buys throughput.
  generator:
    provider: groq
    model: ${GROQ_MODEL:-openai/gpt-oss-120b}
    max_output_tokens: 4096
    timeout_seconds: 90
    # Groq's free tier refuses a single request over this outright — measured,
    # not documented: `HTTP 413 … on tokens per minute (TPM): Limit 8000`. The
    # engine checks the largest request this job would make against it before
    # calling anything.
    max_request_tokens: 8000

  # Cloudflare audits. A different provider and a different model family from
  # the generator, which matters: Workers AI also serves `@cf/openai/gpt-oss-120b`,
  # and auditing GPT-OSS with GPT-OSS would clear the provider bar while being
  # the same model's opinion twice.
  #
  # GLM 4.7 Flash over the 120B Nemotron on measured cost, not on size. One
  # eight-item audit batch is ~200 Neurons against a 10,000/day free plan, so a
  # 100-item book is around a quarter of a day. Nemotron 3 120B is 697 per
  # batch — 91% of the day for one book, with nothing left for the
  # replacements a run actually makes.
  #
  # It thinks before it answers: batches took 71-125s and used ~5,100 output
  # tokens, so both ceilings below are deliberate. The default 90s timeout is
  # not enough.
  auditor:
    provider: cloudflare
    model: ${CLOUDFLARE_AUDIT_MODEL:-@cf/zai-org/glm-4.7-flash}
    max_output_tokens: 8192
    timeout_seconds: 240

  # Shared by both chains, for the case where a primary is down. Gemini answers
  # audit batches in 662 output tokens, which is far leaner than either
  # Cloudflare reasoning model, and it returned a 503 during this pass — the
  # reason it is a fallback rather than a primary.
  fallbacks:
    - provider: gemini
      model: ${GEMINI_MODEL:-gemini-3.7-flash}
      max_output_tokens: 8192
      timeout_seconds: 120

  # Named so it can be smoke-tested and compared against, and routed to by
  # nothing: `build_chains` does not read this list. NVIDIA's hosted tier is
  # here rather than in the route because whether it permits routine commercial
  # use has not been established — a question for whoever owns the account.
  #
  # It is the hosted twin of Cloudflare's Nemotron, which makes it the control
  # worth having when the auditor gold test runs.
  benchmark:
    - provider: nvidia
      model: ${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      max_output_tokens: 8192
      timeout_seconds: 120

  cache: true
  max_attempts: 3

  audit:
    # provider = two endpoints (strict, the default)
    # model    = two models, same provider allowed
    #
    # There is no way to ask for an audit that need not be independent. A model
    # marking its own work is the same reasoning asked twice, which is the
    # failure this stage exists to avoid.
    requirement: provider
    # What happens to rows that fall short. Neither exports one.
    #   needs_review — hold them out of the TSV, let the rest of the run stand
    #   fail         — additionally report the run as unsuccessful
    on_shared: needs_review

output:
  directory: ../output/the-maze-runner
