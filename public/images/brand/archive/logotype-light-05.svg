<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 31 351 150" role="img" aria-labelledby="l-title l-desc">
  <title id="l-title">4steps Book Club — Logotype draft 05 light</title>
  <desc id="l-desc">A light 4steps Book Club logotype with a white numeral four in front of the orange intersection rules and above the gray ruled lines.</desc>
  <g aria-hidden="true">
    <rect x="-2" y="32" width="349" height="148" rx="64" fill="none" stroke="#17342F" stroke-opacity="0.58" stroke-width="1.8"></rect>
    <g transform="translate(2 0)">
      <g stroke="#17342F" stroke-opacity="0.2" stroke-width="1.4">
        <line x1="30" y1="52" x2="308" y2="52"></line>
        <line x1="30" y1="88" x2="308" y2="88"></line>
        <line x1="30" y1="160" x2="308" y2="160"></line>
      </g>
      <line x1="90" y1="32" x2="90" y2="180" stroke="#EF6B4A" stroke-width="2"></line>
      <line x1="30" y1="124" x2="308" y2="124" stroke="#EF6B4A" stroke-width="2"></line>
      <line x1="90" y1="52" x2="90" y2="160" stroke="#F7F3EA" stroke-width="9" stroke-linecap="round"></line>
      <path d="M48 124 L90 52" fill="none" stroke="#17342F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path>
      <line x1="49" y1="124" x2="108" y2="124" stroke="#F7F3EA" stroke-width="9" stroke-linecap="round"></line>
      <text x="130" y="124" font-family="Gowun Batang, serif" font-weight="700" font-size="78" letter-spacing="-1" fill="#17342F">steps</text>
      <text x="132" y="160" font-family="IBM Plex Sans KR, sans-serif" font-weight="700" font-size="22.5" letter-spacing="2.4" fill="#5f716a">BOOK CLUB</text>
    </g>
