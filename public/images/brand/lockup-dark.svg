<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 23 344 174" role="img" aria-labelledby="l-title l-desc">
  <title id="l-title">4steps Book Club</title>
  <desc id="l-desc">Four ruled lines frame a numeral four; the active writing line is coral.</desc>
  <g aria-hidden="true">
      <rect x="2" y="24" width="341" height="172" rx="68" fill="#17342F" stroke="#F7F3EA" stroke-opacity="0.36" stroke-width="1.8"></rect>
      <g transform="translate(2 0)">
      <g stroke="#F7F3EA" stroke-opacity="0.24" stroke-width="1.4">
        <line x1="30" y1="52" x2="310" y2="52"></line>
        <line x1="30" y1="88" x2="310" y2="88"></line>
        <line x1="30" y1="160" x2="310" y2="160"></line>
      </g>
      <line x1="30" y1="124" x2="310" y2="124" stroke="#EF6B4A" stroke-width="2"></line>
      <line x1="40" y1="124" x2="108" y2="124" stroke="#EF6B4A" stroke-width="9"></line>
      <path d="M48 124 L90 52 V160" fill="none" stroke="#F7F3EA" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path>
      <text x="130" y="124" font-family="Gowun Batang, serif" font-weight="700" font-size="78" letter-spacing="-1" fill="#F7F3EA">steps</text>
      <text x="132" y="160" font-family="IBM Plex Sans KR, sans-serif" font-weight="600" font-size="16" letter-spacing="3" fill="#a9b5ac">BOOK CLUB</text>
      </g>
  </g>
</svg>
