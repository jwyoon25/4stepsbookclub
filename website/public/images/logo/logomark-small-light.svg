<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140.6 140.6" role="img" aria-labelledby="small-light-title small-light-desc">
  <title id="small-light-title">4steps Book Club — Small logomark light</title>
  <desc id="small-light-desc">A compact light 4s logomark with alternating ruled and dashed lines, intersecting coral rules, and the numeral four overlaid at their intersection.</desc>
  <g aria-hidden="true">
    <!-- The circle's visible diameter is exactly the finalized pill's 140.6-unit height. -->
    <circle cx="70.3" cy="70.3" r="69.4" fill="#F7F3EA"></circle>
    <!-- The horizontal rules terminate on the circular border. -->
    <g fill="none" stroke="#17342F" stroke-opacity="0.30" stroke-width="1.4">
      <line x1="26.7069" y1="16.3" x2="113.8931" y2="16.3"></line>
      <line x1="10.9674" y1="34.3" x2="129.6326" y2="34.3" stroke-dasharray="8 6"></line>
      <line x1="3.2749" y1="52.3" x2="137.3251" y2="52.3"></line>
      <line x1="0.9" y1="70.38" x2="139.7" y2="70.38" stroke-dasharray="8 6"></line>
      <line x1="11.016" y1="106.38" x2="129.584" y2="106.38" stroke-dasharray="8 6"></line>
      <line x1="26.7069" y1="124.3" x2="113.8931" y2="124.3"></line>
    </g>

    <!-- The active horizontal and vertical rules also terminate on the border. -->
    <g fill="none" stroke="#B84431" stroke-width="2">
      <line x1="3.3181" y1="88.46" x2="137.2819" y2="88.46"></line>
      <line x1="67.787275" y1="0.9455" x2="67.787275" y2="139.6545"></line>
    </g>

    <!-- Embedded Gowun Batang Bold 700 “4”, overlaid on the coral intersection. -->
    <g transform="translate(-22.212725 -35.7)">
      <g transform="translate(90 124.9) scale(1.04) translate(-90 -124.16)">
        <path transform="translate(0 1.4)" d="M96.86 152.16Q96.86 153.56 95.74 154.54Q94.62 155.52 92.94 155.94Q90.7 156.5 87.97 156.78Q85.24 157.06 83.14 157.06V128.36L35.68 128.5V119.82L86.64 52.06Q91.82 51.78 93.92 52.76Q96.02 53.74 96.58 55.84L96.72 117.02Q101.06 117.02 104.21 116.81Q107.36 116.6 111.28 115.76L110.02 124.44Q109.46 128.36 105.4 128.36H96.86ZM83.14 117.02V69.56L47.86 117.02Z" fill="#F2C55C"></path>
      </g>
    </g>

