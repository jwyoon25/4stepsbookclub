    <g transform="translate(-22.212725 -17.6518181818)">
      <g transform="translate(0 -18)">
        <g transform="translate(-10.83 0)">
          <g transform="translate(2.25 6.5)">
            <g transform="translate(130 102.55) scale(0.975 0.9805749806) translate(-130 -102.55)">
              <path d="M145.678 118.93Q142.948 118.93 140.218 118.267Q137.488 117.604 135.226 116.122Q133.822 115.108 132.691 113.743Q131.56 112.378 131.56 111.208Q131.56 110.428 132.691 109.375Q133.822 108.322 135.304 107.386Q136.786 106.45 137.8 106.138Q138.346 108.868 139.945 110.623Q141.544 112.378 143.728 113.236Q145.912 114.094 148.096 114.094Q150.202 114.094 151.567 113.08Q152.932 112.066 153.01 109.882Q153.088 106.684 150.631 105.007Q148.174 103.33 145.054 102.394Q139.984 100.834 136.591 98.299Q133.198 95.764 133.198 91.162Q133.198 85.78 137.371 83.05Q141.544 80.32 147.94 80.32Q152.308 80.32 155.818 81.997Q159.328 83.674 160.186 86.95Q160.186 87.964 159.094 88.939Q158.002 89.914 156.442 90.499Q154.882 91.084 153.478 91.006Q153.322 87.652 151.177 86.17Q149.032 84.688 146.38 84.688Q144.43 84.688 142.753 85.741Q141.076 86.794 141.076 88.978Q141.076 90.85 142.285 92.137Q143.494 93.424 145.327 94.282Q147.16 95.14 149.032 95.764Q151.84 96.622 154.57 97.87Q157.3 99.118 159.094 101.38Q160.888 103.642 160.81 107.542Q160.81 111.442 158.587 113.977Q156.364 116.512 152.893 117.721Q149.422 118.93 145.678 118.93Z" fill="#17342F"></path>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <circle cx="70.3" cy="70.3" r="69.4" fill="none" stroke="#17342F" stroke-width="1.8"></circle>
