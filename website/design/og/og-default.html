<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>4steps Book Club — Open Graph cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      /* Palette and type tokens mirror src/pages/index.astro. */
      :root {
        --ink: #17342f;
        --paper: #f7f3ea;
        --coral-dark: #c84f37;
        --butter: #f2c55c;
        --aqua: #8bc7c3;
        --lilac: #b9abd8;
        --sage: #9dc5a5;
        --text: #263a34;
        --muted: #66766f;
        --font-display: "Gowun Batang", Georgia, serif;
        --font-sans: "IBM Plex Sans KR", system-ui, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--text);
        font-family: var(--font-sans);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      .canvas {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .content {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 60px 76px 38px;
      }

      /* Paper texture: the ruled reading-and-writing page from the logo, at
         texture strength so it never competes with the headline. */
      .rules {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .rules span {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(23, 52, 47, 0.1);
      }

      .rules span.dashed {
        height: 0;
        border-top: 1px dashed rgba(23, 52, 47, 0.1);
      }

      .content > *:not(.rules) { position: relative; z-index: 1; }

      .masthead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .logotype {
        width: 300px;
        /* The SVG viewBox includes left-side breathing room around the bookplate.
           Offset it so the visible border, not the image box, aligns to the grid. */
        margin-left: -32px;
      }

      .edition {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.13em;
      }

      .edition::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--coral-dark);
      }

      .headline {
        margin-top: auto;
        max-width: 900px;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 74px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.045em;
        word-break: keep-all;
      }

      /* Same highlight construction as .hero-title .marker on the site. */
      .marker {
        position: relative;
        display: inline-block;
        z-index: 0;
        color: var(--coral-dark);
      }

      .marker::after {
        content: "";
        position: absolute;
        left: -2px;
        right: -4px;
        bottom: 13px;
        height: 15px;
        z-index: -1;
        border-radius: 999px 30% 999px 30%;
        background: var(--butter);
        transform: rotate(-1deg);
      }

      .lead {
        margin-top: 18px;
        max-width: 760px;
        color: var(--muted);
        font-size: 25px;
        font-weight: 600;
        line-height: 1.45;
        word-break: keep-all;
      }

      .method-band {
        display: flex;
        align-items: center;
        min-height: 128px;
        padding: 0 76px;
        background: var(--ink);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.08);
      }

      .steps {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Same four-stage tabs as .step-tabs on the site. */
      .step {
        padding: 11px 19px 12px;
        border-radius: 999px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.14em;
      }

      .step-read { background: var(--butter); }
      .step-think { background: var(--sage); }
      .step-speak { background: var(--aqua); }
      .step-write { background: var(--lilac); }

      .arrow {
        color: rgba(247, 243, 234, 0.52);
        font-size: 16px;
      }

      .grades {
        margin-left: auto;
        padding-left: 30px;
        border-left: 1px solid rgba(247, 243, 234, 0.22);
        color: var(--paper);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="content">
        <!-- Rules start below the logotype so they never cross its bookplate border. -->
        <div class="rules" aria-hidden="true">
          <span style="top: 218px"></span>
          <span class="dashed" style="top: 278px"></span>
          <span style="top: 338px"></span>
          <span class="dashed" style="top: 398px"></span>
          <span style="top: 458px"></span>
        </div>

        <div class="masthead">
          <img
            class="logotype"
            src="../../public/images/logo/logotype-light.svg"
            alt="4steps Book Club"
          />
          <p class="edition">PREMIUM JUNIOR BOOK CLUB</p>
        </div>

        <h1 class="headline">읽은 책이, 아이의<br /><span class="marker">문장</span>이 되도록.</h1>

        <p class="lead">영어 원서를 깊이 읽고, 근거로 생각하고, 말한 뒤 쓰는 수업.</p>
      </div>

      <div class="method-band">
        <div class="steps">
          <span class="step step-read">READ</span>
          <span class="arrow">→</span>
          <span class="step step-think">THINK</span>
          <span class="arrow">→</span>
          <span class="step step-speak">SPEAK</span>
          <span class="arrow">→</span>
          <span class="step step-write">WRITE</span>
        </div>
        <span class="grades">G1–G9 · 4인 소수 관리형</span>
      </div>
    </div>
  </body>
</html>
